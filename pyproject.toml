[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "smiles-notation-inconsistency"
version = "1.0.0"
description = "SMILES notation preprocessing, Transformer–VAE modeling, and article analyses"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{name = "Yosuke Kikuchi"}, {name = "Tadahaya Mizuno", email = "tadahaya@gmail.com"}]
dependencies = [
  "numpy==2.3.5", "pandas==2.2.3", "scikit-learn==1.8.0",
  "scipy==1.17.0", "matplotlib==3.10.8", "Pillow==12.3.0",
]

[project.optional-dependencies]
model = ["torch==2.10.0", "rdkit==2025.9.3"]
test = ["pytest==9.0.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/smiles_notation"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
